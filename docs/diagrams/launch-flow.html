<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>

a-label="Step 6: icon, images, text and privacy policy"><rect x="960" y="128" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="960" y="128" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="968" y="136" width="60" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="998.0" y="145" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ASKS YOU</text><text x="1080" y="172" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Store listing kit</text><text x="1080" y="190" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">icon · images · text · policy</text></g><g data-motion-item data-step="7" aria-label="Step 7: save and re-read every section"><rect x="960" y="328" width="240" height="80" rx="6" fill="#f5f5f5"/><rect x="960" y="328" width="240" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><rect x="968" y="336" width="36" height="12" rx="2" fill="transparent" stroke="#bf4520" stroke-opacity="0.4" stroke-width="0.8"/><text x="986.0" y="345" fill="#bf4520" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AUTO</text><text x="1080" y="372" fill="#2d3142" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Play Console</text><text x="1080" y="390" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">save → re-read → submit</text></g><g data-motion-item data-step="8" aria-label="Step 8: report what is done, waiting and blocked"><rect x="980" y="528" width="200" height="72" rx="20" fill="#f5f5f5"/><rect x="980" y="528" width="200" height="72" rx="20" fill="#ffffff" strok
