<!DOCTYPE html>
<html lang="en">
<head>

  <title>Every item is tracked to the console</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>

s-arrow)"/><path d="M256 172 L336 172" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#item-states-arrow)"/><path d="M496 172 L576 172" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#item-states-arrow-accent)"/><path d="M736 172 L816 172" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#item-states-arrow)"/><path d="M976 172 L1056 172" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#item-states-arrow)"/><path d="M1136 204 L1136 380" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#item-states-arrow)"/><path d="M148 204 L148 380" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#item-states-arrow)"/><path d="M204 380 L204 204" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#item-states-arrow)"/><path d="M1056 412 L1008 412" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#item-states-arrow)"/><rect x="260.0" y="148" width="72" height="16" rx="2" fill="#f5f5f5"/><text x="296" y="160" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHECKED</text><rect x="500.0" y="148" width="72" height="16" rx="2" fill="#f5f5f5"/><text x="536" y="160" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RE-READ</text><rect x="752.0" y="148" width="48" height="16" rx="2" fill="#f5f5f5"/><text x="776" y="160" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SENT</text><rect x="984.0" y="148" width="64" height="16" rx="2" fill="#f5f5f5"/><text x="1016" y="160" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PASSED</text><rect x="1144" y="284" width="72" height="16" rx="2" fill="#f5f5f5"/><text x="1180.0" y="296" fill="#5a6
