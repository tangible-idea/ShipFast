<!DOCTYPE html>

<head>

  <title>How the privacy policy is made</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #2d3142; --color-ink: #f5f5f5; --color-muted: #bfc0c0;

    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>

dle">never guessed</text><rect x="1000" y="520" width="200" height="80" rx="6" fill="#2d3142"/><rect x="1000" y="520" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="1100" y="558" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Play Console</text><text x="1100" y="576" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">URL + data safety</text></g></svg>
