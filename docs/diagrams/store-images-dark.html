<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How store images are made</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #2d3142; --color-ink: #f5f5f5; --color-muted: #bfc0c0;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · ShipFast</p>
    <h1>How store images are made</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="store-images-dark-title store-images-dark-desc"><title id="store-images-dark-title">How store images are made</title><desc id="store-images-dark-desc">Flowchart of the image pipeline: a release build on a real phone is captured, you check the capture is safe to publish or recapture with demo data, the renderer crops, scales and captions it into Google Play and App Store images, and they are uploaded, saved and re-read in the store console.</desc><defs><marker id="store-images-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="store-images-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="store-images-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><g transform="translate(0 -64)"><line x1="40" y1="588" x2="1240" y2="588" stroke="rgba(245,245,245,0.1)" stroke-width="0.8"/><text x="40" y="616" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><rect x="128" y="604" width="28" height="16" rx="4" fill="rgba(191,192,192,0.10)" stroke="#949eb2"/><text x="168" y="616" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">Device</text><rect x="264" y="604" width="28" height="16" rx="4" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0"/><text x="304" y="616" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">Private file</text><rect x="444" y="604" width="28" height="16" rx="4" fill="#393e53" stroke="#f5f5f5"/><text x="484" y="616" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">Step</text><rect x="564" y="604" width="28" height="16" rx="4" fill="rgba(240,138,89,0.1)" stroke="#f08a59"/><text x="604" y="616" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">Renderer</text><path d="M200 240 L240 240" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#store-images-arrow)"/><path d="M400 240 L440 240" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#store-images-arrow)"/><path d="M600 240 L640 240" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#store-images-arrow-accent)"/><path d="M520 296 L520 400" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#store-images-arrow)"/><path d="M440 440 L128 440 A8 8 0 0 1 120 432 L120 280" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#store-images-arrow)"/><path d="M840 224 L848 224 A8 8 0 0 0 856 216 L856 168 A8 8 0 0 1 864 160 L880 160" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#store-images-arrow)"/><path d="M840 256 L860 256 A8 8 0 0 1 868 264 L868 312 A8 8 0 0 0 876 320 L880 320" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#store-images-arrow)"/><path d="M1080 160 L1112 160 A8 8 0 0 1 1120 168 L1120 512 A8 8 0 0 1 1112 520 L1080 520" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#store-images-arrow)"/><path d="M980 360 L980 480" fill="none" stroke="#bfc0c0" stroke-width="1" marker-end="url(#store-images-arrow)"/><rect x="600.0" y="216" width="40" height="16" rx="2" fill="#2d3142"/><text x="620" y="228" fill="#949eb2" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="528" y="340" width="32" height="16" rx="2" fill="#2d3142"/><text x="544.0" y="352" fill="#949eb2" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><g data-motion-item data-step="1" aria-label="Step 1: release build on a real phone"><rect x="40" y="200" width="160" height="80" rx="6" fill="#2d3142"/><rect x="40" y="200" width="160" height="80" rx="6" fill="rgba(191,192,192,0.10)" stroke="#949eb2" stroke-width="1"/><text x="120" y="238" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Release build</text><text x="120" y="256" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">real phone · adb</text></g><g data-motion-item data-step="2" aria-label="Step 2: raw capture kept private"><rect x="240" y="200" width="160" height="80" rx="6" fill="#2d3142"/><rect x="240" y="200" width="160" height="80" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/><text x="320" y="238" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Raw capture</text><text x="320" y="256" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">.shipfast/captures</text></g><g data-motion-item data-step="3" aria-label="Step 3: you check for personal data"><polygon points="520,184 600,240 520,296 440,240" fill="#2d3142"/><polygon points="520,184 600,240 520,296 440,240" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="520" y="236" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Safe to</text><text x="520" y="256" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">publish?</text></g><g data-motion-item data-step="4" aria-label="Step 4: otherwise recapture with demo data"><rect x="440" y="400" width="160" height="80" rx="6" fill="#2d3142"/><rect x="440" y="400" width="160" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="520" y="438" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Recapture</text><text x="520" y="456" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">with demo data</text></g><g data-motion-item data-step="5" aria-label="Step 5: renderer crops, scales and captions"><rect x="640" y="200" width="200" height="80" rx="6" fill="#2d3142"/><rect x="640" y="200" width="200" height="80" rx="6" fill="rgba(240,138,89,0.1)" stroke="#f08a59" stroke-width="1"/><text x="740" y="238" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Renderer</text><text x="740" y="256" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">crop · scale · caption</text></g><g data-motion-item data-step="6" aria-label="Step 6: Google Play and App Store images"><rect x="880" y="120" width="200" height="80" rx="6" fill="#2d3142"/><rect x="880" y="120" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="980" y="158" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Google Play</text><text x="980" y="176" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1080×1920 · 1024×500</text></g><g data-motion-item data-step="6" aria-label="Step 6: Google Play and App Store images"><rect x="880" y="280" width="200" height="80" rx="6" fill="#2d3142"/><rect x="880" y="280" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="980" y="318" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">App Store</text><text x="980" y="336" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1320×2868 · 21:9 · 3:2</text></g><g data-motion-item data-step="7" aria-label="Step 7: upload, save and re-read"><rect x="880" y="480" width="200" height="80" rx="6" fill="#2d3142"/><rect x="880" y="480" width="200" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="980" y="518" fill="#f5f5f5" font-size="16" font-weight="600" font-family="Geist, system-ui, sans-serif" text-anchor="middle">Store console</text><text x="980" y="536" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">upload · save · re-read</text></g></g></svg>
    </div>
  </div>
</body>
</html>
